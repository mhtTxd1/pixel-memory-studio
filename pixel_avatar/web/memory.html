<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八秒回忆 · 微像素工作台</title>
<style>body{max-width:1000px;margin:48px auto;padding:0 22px;background:#f4f0e8;color:#293c32;font-family:system-ui}h1{font-size:36px}p{line-height:1.8;color:#657369}section{padding:24px;border:1px solid #dce1d5;border-radius:20px;background:#fffdf8;margin:20px 0}label{display:block;margin:14px 0 6px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #cdd6c8;border-radius:8px;box-sizing:border-box}input:not([type=file]),textarea{width:100%}textarea{height:86px}button{background:#315b47;color:white;margin:14px 8px 0 0;cursor:pointer}button:disabled{opacity:.5}img,video{max-width:100%;max-height:550px;border-radius:12px;margin-top:18px}img{image-rendering:pixelated}#error{color:#a13e39;white-space:pre-wrap}a{color:#315b47}.row{display:flex;gap:20px;flex-wrap:wrap}.row>div{flex:1;min-width:220px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<body><a href="/">← 人物生成工作台</a><h1>把今天，留成八秒小回忆。</h1><p>一张照片或一段场景描述，加上已经生成的人物。背景保持微像素风格，人物按时间线活动，导出可保存的 2D 视频。</p>
<label>服务访问令牌 · 仅保存在页面内存</label><input id="token" type="password" autocomplete="off"><p id="error" role="alert"></p>
<section><h2>01 / 准备场景</h2><label>场景描述</label><textarea id="description" placeholder="傍晚我们常去的公园，暖色路灯，远处有湖，前景是一条开阔的小路"></textarea><label>或上传场景照片（也可以同时补充描述）</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp">
<div class="row"><div><label>画面比例</label><select id="aspect"><option value="landscape">横屏 16:9</option><option value="portrait">竖屏 9:16</option><option value="square">方形 1:1</option></select></div><div><label>像素程度</label><select id="block"><option value="2">轻像素</option><option value="4">明显像素</option><option value="1">模型原生像素风</option></select></div></div>
<label>人物风格参考 ID（可选，需已通过原型审核）</label><input id="style"><button id="createScene">创建场景任务</button><label>场景任务 ID</label><input id="scene"><button id="runScene">生成背景（调用模型）</button><button id="readScene">读取场景状态</button><button id="retryScene">按新描述重置背景</button><pre id="sceneStatus">尚无场景</pre><img id="background" hidden alt="生成的微像素背景"><p>生成后检查场景是否正确，以及人物落脚的前景是否开阔。不满意可修改描述后重置。重置不会修改已有视频。</p></section>
<section><h2>02 / 组合人物与记录</h2><label>第一个人物 ID（需最终审核通过）</label><input id="actorA"><label>第二个人物 ID（可选）</label><input id="actorB"><label>今天想留下的一句话</label><input id="caption" maxlength="100" placeholder="今天，我们又一起走过了这条小路。"><label>动作安排</label><select id="preset"><option value="meet">相遇 · 走近、挥手、对视</option><option value="celebrate">庆祝 · 走近、跳跃、对视</option><option value="quiet">陪伴 · 一起安静站着</option></select><p>默认 8 秒、24 帧/秒、无声 MP4。自定义时间线可通过 API 或 CLI 配置。</p><button id="createMovie">创建视频任务</button><label>视频任务 ID</label><input id="movie"><button id="runMovie">合成视频（本地处理）</button><button id="readMovie">读取视频状态</button><pre id="movieStatus">尚无视频</pre><video id="video" controls hidden></video><br><button id="download" hidden>下载 MP4</button></section>
<script type="module">
const $=id=>document.getElementById(id);let sceneActive=false,movieActive=false,bgURL,videoURL;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+$('token').value,...opts.headers}});if(!r.ok){const e=await r.json();throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail));}return r;}
const sj=()=>'/v1/scenes/'+encodeURIComponent($('scene').value.trim());const mj=()=>'/v1/memories/'+encodeURIComponent($('movie').value.trim());
async function guarded(fn){$('error').textContent='';try{await fn();}catch(e){$('error').textContent=e.message;}}
async function sceneStatus(){const j=await(await api(sj())).json();sceneActive=j.active;$('sceneStatus').textContent=j.status+(j.active?' · 处理中':'')+(j.error?'\n'+j.error:'');$('runScene').disabled=j.active||j.status==='ready';$('retryScene').disabled=j.active;
if(j.status==='ready'){if(bgURL)URL.revokeObjectURL(bgURL);bgURL=URL.createObjectURL(await(await api(sj()+'/files/background.png')).blob());$('background').src=bgURL;$('background').hidden=false;}else $('background').hidden=true;}
async function movieStatus(){const j=await(await api(mj())).json();movieActive=j.active;$('movieStatus').textContent=j.status+' · '+Math.round(j.progress*100)+'%'+(j.error?'\n'+j.error:'');$('runMovie').disabled=j.active||j.status==='ready';$('video').hidden=j.status!=='ready';$('download').hidden=j.status!=='ready';if(j.status==='ready'){if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(await(await api(mj()+'/files/memory.mp4')).blob());$('video').src=videoURL;}}
$('createScene').onclick=()=>guarded(async()=>{const f=new FormData();for(const [key,id] of [['description','description'],['style_avatar_id','style'],['aspect','aspect'],['pixel_block','block']])f.append(key,$(id).value);if($('photo').files[0])f.append('photo',$('photo').files[0]);const j=await(await api('/v1/scenes',{method:'POST',body:f})).json();$('scene').value=j.id;await sceneStatus();});
$('runScene').onclick=()=>guarded(async()=>{await api(sj()+'/run',{method:'POST'});await sceneStatus();});$('readScene').onclick=()=>guarded(sceneStatus);
$('retryScene').onclick=()=>guarded(async()=>{await api(sj()+'/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:$('description').value})});await sceneStatus();});
$('createMovie').onclick=()=>guarded(async()=>{const body={scene_id:$('scene').value.trim(),avatar_ids:[$('actorA').value.trim(),$('actorB').value.trim()].filter(Boolean),options:{caption:$('caption').value,preset:$('preset').value}};const j=await(await api('/v1/memories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();$('movie').value=j.id;await movieStatus();});
$('runMovie').onclick=()=>guarded(async()=>{await api(mj()+'/run',{method:'POST'});await movieStatus();});$('readMovie').onclick=()=>guarded(movieStatus);$('download').onclick=()=>{const a=document.createElement('a');a.href=videoURL;a.download='memory.mp4';a.click();};
setInterval(()=>{if(sceneActive)guarded(sceneStatus);if(movieActive)guarded(movieStatus);},4000);
</script></body></html>
