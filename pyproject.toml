[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "couple-pixel-avatar"
version = "0.2.0"
description = "Portable photo-to-pixel avatar pipeline with 16 gaze directions"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "openai>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "filelock>=3.16,<4", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
pixel-avatar = "pixel_avatar.cli:main"
pixel-memory = "pixel_avatar.memory_cli:main"

[tool.setuptools.packages.find]
include = ["pixel_avatar*"]

[tool.setuptools.package-data]
pixel_avatar = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
